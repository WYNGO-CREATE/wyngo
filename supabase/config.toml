project_id = "mwkkgubvdswmdaiswepl"

[functions.invite-collaborator]
verify_jwt = true

[functions.gmail-oauth-callback]
verify_jwt = true

[functions.gmail-sync]
# JWT verification désactivée pour permettre l'appel via pg_cron (cron secret)
# Le contrôle d'accès est géré dans le code (auth header OU x-cron-secret)
verify_jwt = false

[functions.gmail-send]
verify_jwt = true

[functions.workflow-tick]
# Auth interne : x-cron-secret OU JWT user (l'edge code vérifie lui-même)
verify_jwt = false

[functions.script-generate]
verify_jwt = true

[functions.template-generate]
verify_jwt = true

[functions.naf-audit]
# Outil d'audit interne : chaque appel dépense du Google Places, il ne doit
# pas être joignable sans être authentifié.
verify_jwt = true

[functions.mesure]
# Collecteur d'audience : appelé par les sites clients depuis le navigateur
# d'un visiteur anonyme, qui ne peut par nature pas s'authentifier.
verify_jwt = false
